# twist_mux 우선순위 설정 (숫자가 클수록 우선, timeout 초과 시 해당 입력은 무시)
twist_mux:
  ros__parameters:
    topics:
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.3
        priority: 100
      avoid:
        topic: /cmd_vel_avoid
        timeout: 0.5
        priority: 60
      nav:
        topic: /cmd_vel_nav
        timeout: 0.5
        priority: 20
