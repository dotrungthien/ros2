<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMR 제어</title>
<!-- viec 111 /v10 (cau_noi_xe.py + trang_v10.py). CSS theo mockup v10. Khong tai thu vien ngoai mang. CHUA THU TREN XE. -->
<style>
:root{--bg:#f7f6f3;--s1:#efede8;--s2:#ffffff;--tx:#1f1e1c;--tx2:#5f5e5a;--tx3:#888780;--bd:#d3d1c7;--bd2:#b4b2a9;
--bgok:#eaf3de;--txok:#27500a;--bgac:#e6f1fb;--txac:#0c447c;--bgdg:#fcebeb;--txdg:#a32d2d;--bddg:#f09595;--txwn:#854f0b;--r:8px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1c1c1b;--s1:#262624;--s2:#2c2c2a;--tx:#f1efe8;--tx2:#b4b2a9;--tx3:#888780;--bd:#444441;--bd2:#5f5e5a;
--bgok:#173404;--txok:#c0dd97;--bgac:#042c53;--txac:#b5d4f4;--bgdg:#501313;--txdg:#f7c1c1;--bddg:#a32d2d;--txwn:#fac775}}
:root[data-theme="dark"]{--bg:#1c1c1b;--s1:#262624;--s2:#2c2c2a;--tx:#f1efe8;--tx2:#b4b2a9;--tx3:#888780;--bd:#444441;--bd2:#5f5e5a;
--bgok:#173404;--txok:#c0dd97;--bgac:#042c53;--txac:#b5d4f4;--bgdg:#501313;--txdg:#f7c1c1;--bddg:#a32d2d;--txwn:#fac775}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.5}
button{font:inherit;color:var(--tx);background:var(--s2);border:0.5px solid var(--bd2);border-radius:var(--r);cursor:pointer}
button:active{transform:scale(0.98)}
button:disabled{color:var(--tx3);cursor:default}
.wrap{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;max-width:980px;margin:0 auto}
@media (max-width:720px){.wrap{grid-template-columns:1fr}}
.frame{background:var(--s1);border-radius:12px;padding:12px}
.ph{background:var(--s2);border:0.5px solid var(--bd2);border-radius:16px;padding:12px}
.chip{font-size:12px;padding:3px 10px;border-radius:var(--r);display:inline-block}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btns button{flex:1;min-width:84px;height:38px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.pad button{height:48px;font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button.on{background:var(--bgac);color:var(--txac)}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:0.5px solid var(--bd)}
.row span:first-child{color:var(--tx2);min-width:96px}
.lg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--tx2);margin-top:6px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.loi{font-size:12px;color:var(--txdg);margin-top:4px}
body.bao{background:var(--bgdg)}
</style>
</head>
<body>
<div class="wrap">
<div class="frame">
<div class="ph">
<div style="display:flex;justify-content:space-between;align-items:center">
<span style="font-size:14px;font-weight:500">AMR 제어</span>
<span id="chip" class="chip">연결 안 됨</span>
</div>
<div id="tt" style="font-size:16px;font-weight:500;margin-top:8px">연결 안 됨</div>
<div id="sub" style="font-size:13px;color:var(--tx2);min-height:36px;white-space:pre-wrap">-</div>
<canvas id="cv" width="312" height="192" style="width:100%;border-radius:8px;margin-top:6px;cursor:pointer;touch-action:manipulation"></canvas>
<div id="bdloi" class="loi"></div>
<div class="lg"><span><i style="background:#5F5E5A"></i>벽</span><span><i style="background:#F09595"></i>차량 중심 금지</span><span><i style="background:#FAC775"></i>주의 구역</span><span><i style="background:#C0DD97"></i>목적지 선택 가능</span></div>
<div id="vitri" style="font-size:11px;color:var(--tx3);margin-top:2px"></div>
<div id="ctl"></div>
<div id="kmsg" style="font-size:13px;margin-top:8px;min-height:20px;color:var(--txwn);white-space:pre-wrap"></div>
</div>
</div>
<div>
<div style="font-size:12px;color:var(--tx3);margin-top:8px">비상 정지 = 모터 스위치. '정지'는 Nav2 목표만 취소합니다.</div>
</div>
</div>
<script>
/*HAN_JS*/
var S={ma:'TT_KHONG_KET_NOI'},LOCAL=null,pin='';
try{pin=sessionStorage.getItem('pin')||'';}catch(e){}
function $(id){return document.getElementById(id);}
function set(id,t){$(id).textContent=t;}
function ten(ma){return HAN_TU[ma]||ma;}
function chip(t,ok){var e=$('chip');e.textContent=t;e.style.background=ok?'var(--bgok)':'var(--s1)';e.style.color=ok?'var(--txok)':'var(--tx2)';}
function ma(){return LOCAL||S.ma;}
function phu(m){
  var c=S.chuyen||{};
  switch(m){
  case 'TT_KHONG_KET_NOI':return S.loi?S.loi:(S.link==='fail'?'연결 실패: '+(han(S.chi_tiet)||'-'):'차량을 A 지점에 놓고 누르세요');
  case 'TT_DANG_KET_NOI':return '팀 확인 중: 차체 · Nav2 · 두뇌 · 보조 운전 ('+Math.round(S.connect_s||(S.bat&&S.bat.giay)||0)+'초)'+(S.bat&&S.bat.dong?'\n'+han(S.bat.dong):'');
  case 'TT_SAN_SANG':return '지도에서 목적지를 누르세요'+(S.han_s!==null&&S.han_s!==undefined?' (남은 시간 '+S.han_s+'초)':'');
  case 'TT_XEM_TUYEN':return '파란 경로를 따라갑니다. 출발을 누르세요';
  case 'TT_DANG_DI':return '경로를 따라가고 있어요';
  case 'TT_DANG_CHO':return '앞이 막혔어요. 기다리는 중 ('+han(S.ly_do)+')';
  case 'TT_DANG_THOAT':return '보조 운전이 차량을 빼내고 있어요 ('+han(S.ly_do)+')';
  case 'TT_DANG_XOAY':return '제자리에서 회전해요 ('+han(S.ly_do)+')';
  case 'TT_DA_DEN':return '새 목적지를 고르세요\n'+(han(c.dong)||'');
  case 'TT_CAN_GIUP':return '통로가 막혔어요. 확인 후 수동 조종하거나 다시 시도하세요 ('+han(S.ly_do)+')';
  case 'TT_LAI_TAY':return '누르고 있는 동안만 움직여요';
  case 'TT_DANG_NGAT':return '모든 프로세스 종료 중';
  case 'TT_DA_NGAT':return '모든 프로세스 종료 · Pi 전원은 터미널에서\n'+(han(S.tat&&S.tat.dong)||'');
  }
  return '';
}
function nut(ds){return '<div class="btns">'+ds.map(function(d){return '<button'+(d[1]?' onclick="'+d[1]+'"':' disabled')+(d[2]?' style="'+d[2]+'"':'')+'>'+d[0]+'</button>';}).join('')+'</div>';}
var DO='border-color:var(--bddg);color:var(--txdg)';
function ui(){
  var m=ma(),h='';
  set('tt',ten(m));set('sub',phu(m));
  chip(m==='TT_KHONG_KET_NOI'||m==='TT_DA_NGAT'||m==='TT_DANG_NGAT'?'연결 안 됨':m==='TT_DANG_KET_NOI'?'연결 중':m==='TT_CAN_GIUP'?'도움 필요':'연결됨',
       ['TT_KHONG_KET_NOI','TT_DA_NGAT','TT_DANG_NGAT','TT_DANG_KET_NOI','TT_CAN_GIUP'].indexOf(m)<0);
  if(m==='TT_KHONG_KET_NOI'||m==='TT_DA_NGAT')h=nut([['차량 연결',"lenh('bat')"]]);
  else if(m==='TT_DANG_KET_NOI')h=nut([['연결 중…']]);
  else if(m==='TT_DANG_NGAT')h=nut([['종료 중…']]);
  else if(m==='TT_SAN_SANG'||m==='TT_DA_DEN')h=nut([['수동 조종',"vao_lai_tay()"],['연결 해제',"lenh('tat')"]]);
  else if(m==='TT_XEM_TUYEN')h=nut([['출발',"lenh('di')"],['취소',"huy_chon()"]]);
  else if(['TT_DANG_DI','TT_DANG_CHO','TT_DANG_THOAT','TT_DANG_XOAY'].indexOf(m)>=0)h=nut([['정지',"lenh('dung')",DO],['수동 조종',"vao_lai_tay()"]]);
  else if(m==='TT_CAN_GIUP')h=nut([['수동 조종',"vao_lai_tay()"],['다시 시도',"lenh('thu_lai')"],['정지',"lenh('dung')",DO]]);
  else if(m==='TT_LAI_TAY')h=nut([['자동으로',"ra_lai_tay()"],['연결 해제',"lenh('tat')"]]);
  if($('ctl').getAttribute('data-h')!==h){$('ctl').innerHTML=h;$('ctl').setAttribute('data-h',h);}
  ve();
}
var CHON=null;   // M3: {dich:'B'|'A', ...} sau khi cham ban do
// M4: cung hanh dong voi /nut (cung cau hoi xac nhan); PIN nhu /nut (401 -> hoi, giu trong sessionStorage)
var HOI={bat:'전체를 껐다가 다시 시작할까요 (B단계)? 차량은 A선, 모터 OFF.',tat:'차량의 ROS 전체를 종료할까요?',
  di_B:'B로 출발? 모터 ON, 손은 스위치 옆에.',ve_A:'A로 복귀? 모터 ON, 손은 스위치 옆에.'};
var TEN_LENH={bat:'차량 연결',tat:'연결 해제',dung:'정지',di:'출발',thu_lai:'다시 시도'};
function lenh(x,than,da_hoi){
  if(x==='di'&&!than){if(!CHON){set('kmsg','목적지를 먼저 고르세요');return;}than={dich:CHON.dich};}
  var k=x==='di'?(than.dich==='B'?'di_B':'ve_A'):x;
  if(!da_hoi&&HOI[k]&&!confirm(HOI[k]))return;
  var o={method:'POST',headers:{'X-Pin':pin}};
  if(than){o.body=JSON.stringify(than);o.headers['Content-Type']='application/json';}
  fetch('/v10/api/'+x,o).then(function(r){
    if(r.status===401){pin=prompt('PIN 입력')||'';try{sessionStorage.setItem('pin',pin);}catch(e){}return lenh(x,than,true);}
    return r.json().then(function(j){
      var t=TEN_LENH[x]+': ';
      if(r.status===409)t+='다른 작업 중이에요 (409)';
      else if(r.status>=400)t+='오류 '+r.status+' '+(j.loi||'');
      else if(x==='dung')t+=han(j.ket_qua)+(j.ms!==null&&j.ms!==undefined?' '+j.ms+' ms':'');
      else t+='시작됨';
      set('kmsg',t);if(x==='di'&&r.status===202){CHON=null;LOCAL=null;}hoi();
    });
  }).catch(function(e){set('kmsg',TEN_LENH[x]+': 네트워크 오류 '+e);});
}
function vao_lai_tay(){set('kmsg','수동 조종: 미구현');}
function ra_lai_tay(){LOCAL=null;ui();}
function huy_chon(){LOCAL=null;CHON=null;ui();}
// ---- M2: ban do (/v10/ban_do: vung tu tep cua xe, khong so rieng) ----
var BD=null,P=6,cv=document.getElementById('cv'),c=cv.getContext('2d');
var COL=['#5F5E5A','#F09595','#FAC775','#C0DD97'];
function tai_ban_do(){
  fetch('/v10/ban_do',{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
    if(j.loi){BD=null;set('bdloi','지도 오류: '+j.loi);setTimeout(tai_ban_do,10000);}
    else{BD=j;set('bdloi','');cv.width=j.w*P;cv.height=j.h*P;}
    ve();
  }).catch(function(){setTimeout(tai_ban_do,10000);});
}
function tp(x,y){return [(x-BD.ox)/BD.res*P,(BD.h-(y-BD.oy)/BD.res)*P];}
function vung_tai(x,y){if(!BD)return -1;var i=Math.floor((x-BD.ox)/BD.res),j=Math.floor((y-BD.oy)/BD.res);
  if(i<0||j<0||i>=BD.w||j>=BD.h)return 0;return +BD.vung[j*BD.w+i];}
function co_xe(){return S.pose&&['TT_KHONG_KET_NOI','TT_DA_NGAT','TT_DANG_NGAT'].indexOf(S.ma)<0;}
function diem(x,y,mau,chu){var q=tp(x,y);c.fillStyle=mau;c.beginPath();c.arc(q[0],q[1],6,0,7);c.fill();c.fillStyle='#fff';c.font='11px sans-serif';c.fillText(chu,q[0]-3.5,q[1]+4);}
function ve(){
  if(!BD){c.clearRect(0,0,cv.width,cv.height);return;}
  var tat=['TT_KHONG_KET_NOI','TT_DA_NGAT'].indexOf(ma())>=0;
  for(var j=0;j<BD.h;j++)for(var i=0;i<BD.w;i++){c.fillStyle=tat?'#D3D1C7':COL[+BD.vung[j*BD.w+i]];c.fillRect(i*P,(BD.h-1-j)*P,P,P);}
  diem(BD.A[0],BD.A[1],'#2C2C2A','A');diem(BD.B[0],BD.B[1],'#A32D2D','B');
  if(typeof ve_them==='function')ve_them();
  if(co_xe()){var x=S.pose.x,y=S.pose.y,th=S.pose.goc_do*Math.PI/180,cs=Math.cos(th),sn=Math.sin(th);
    c.fillStyle=vung_tai(x,y)===1?'#A32D2D':'#534AB7';c.beginPath();
    BD.footprint.forEach(function(f,k){var q=tp(x+f[0]*cs-f[1]*sn,y+f[0]*sn+f[1]*cs);k?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});c.closePath();c.fill();
    var m=tp(x,y),mx=Math.max.apply(null,BD.footprint.map(function(f){return f[0];})),n=tp(x+mx*cs,y+mx*sn);
    c.strokeStyle='#fff';c.lineWidth=2;c.beginPath();c.moveTo(m[0],m[1]);c.lineTo(n[0],n[1]);c.stroke();}
  set('vitri',S.pose?'위치 (두뇌 기록 '+S.pose.gio.slice(11)+'): x '+S.pose.x.toFixed(2)+' m, y '+S.pose.y.toFixed(2)+' m, '+Math.round(S.pose.goc_do)+'°'
      +(vung_tai(S.pose.x,S.pose.y)===1?' · 차량 중심이 금지 구역 안':''):'위치 없음 (두뇌 기록 없음)');
}
function hoi(){
  fetch('/v10/trang_thai',{cache:'no-store'}).then(function(r){return r.json();}).then(function(s){S=s;
    if(LOCAL==='TT_XEM_TUYEN'&&['TT_SAN_SANG','TT_DA_DEN'].indexOf(S.ma)<0)LOCAL=null;
    ui();}).catch(function(){S={ma:'TT_KHONG_KET_NOI',loi:'Pi 연결 끊김'};ui();});
}
tai_ban_do();hoi();setInterval(hoi,1000);
</script>
</body>
</html>
